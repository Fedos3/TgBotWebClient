# Auto-deploy «tgpanel» to Coolify: every push to main rebuilds the app.
# Manual run: Actions → Deploy → Run workflow.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
name: Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: deploy-tgpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Trigger Coolify deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" \
            || { echo "::error::deploy secrets are not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST"
